server {
    # Cloud Run expects the app to listen on port 8080
    listen 8080;
    
    # The folder where your React app files live
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # This is the magic line for React Apps
        # It tries to find the file requested. If not found, it sends index.html
        # This allows React Router to handle the page change.
        try_files $uri $uri/ /index.html;
    }
}
