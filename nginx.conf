server {
    listen 8080;
    
    # Where your built React app lives
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # This is crucial for React/Vite apps!
        # It tries to find the file, and if it can't, it sends the user to index.html
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
