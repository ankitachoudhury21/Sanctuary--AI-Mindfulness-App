<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Sanctuary | Meditation, Celestial Audio & Gratitude</title>
    <meta name="description" content="Sanctuary — A serene mindfulness space for meditation soundscapes, celestial audio, and gratitude reflection." />
    <meta property="og:title" content="Sanctuary | Meditation, Celestial Audio & Gratitude" />
    <meta property="og:description" content="A serene mindfulness space for meditation soundscapes, celestial audio, and gratitude reflection." />
    <link rel="preconnect" href="https://esm.sh">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['Fraunces', 'Georgia', 'serif'],
              sans: ['Plus Jakarta Sans', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            },
            colors: {
              stone: {
                50: '#FAF9F6',
                100: '#F5F4EF',
                200: '#E8E6DF',
              },
              pine: {
                600: '#0F5E59',
                700: '#0B4642',
                800: '#083330',
              }
            }
          }
        }
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --sanctuary-teal: #0F5E59;
        --sanctuary-teal-bright: #2DD4BF;
        --sanctuary-canvas: #F5F4EF;
        --sanctuary-surface: #FFFFFF;
        --sanctuary-ink: #111827;
        --sanctuary-muted: #5B6472;
        --sanctuary-border: rgba(15, 23, 42, 0.08);
        --sanctuary-focus-ring: rgba(15, 94, 89, 0.35);
      }

      .dark {
        --sanctuary-teal: #2DD4BF;
        --sanctuary-canvas: #090D12;
        --sanctuary-surface: #111720;
        --sanctuary-ink: #F1F5F9;
        --sanctuary-muted: #94A3B8;
        --sanctuary-border: rgba(255, 255, 255, 0.08);
        --sanctuary-focus-ring: rgba(45, 212, 191, 0.4);
      }

      html {
        -webkit-text-size-adjust: 100%;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }

      body {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        overflow-x: hidden;
        background-color: var(--sanctuary-canvas);
        color: var(--sanctuary-ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none;
        line-height: 1.6;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .font-editorial {
        font-family: 'Fraunces', Georgia, serif;
        letter-spacing: -0.02em;
      }

      .font-display {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        letter-spacing: -0.025em;
      }

      .display-number {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.03em;
      }

      .label-caps {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-weight: 600;
        font-size: 0.7rem;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(15, 23, 42, 0.08);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03), 0 12px 32px -12px rgba(15, 23, 42, 0.06);
      }

      .dark .glass-card {
        background: rgba(17, 23, 32, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 12px 36px -12px rgba(0, 0, 0, 0.45);
      }

      .calm-btn-primary {
        background-color: #0F5E59;
        color: #FFFFFF;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 600;
        transition: background-color 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
      }

      .calm-btn-primary:hover:not(:disabled) {
        background-color: #0B4642;
        box-shadow: 0 8px 24px -6px rgba(15, 94, 89, 0.35);
      }

      .dark .calm-btn-primary {
        background-color: #14B8A6;
        color: #042F2E;
      }

      .dark .calm-btn-primary:hover:not(:disabled) {
        background-color: #2DD4BF;
        box-shadow: 0 8px 24px -6px rgba(45, 212, 191, 0.35);
      }

      .calm-btn-primary:active:not(:disabled) {
        transform: scale(0.985);
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(15, 23, 42, 0.16);
        border-radius: 9999px;
      }

      .dark ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      .text-balance {
        text-wrap: balance;
      }

      :focus-visible {
        outline: 2px solid var(--sanctuary-focus-ring);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "recharts": "https://esm.sh/recharts@^3.6.0"
      }
    }
    </script>
  </head>
  <body class="selection:bg-teal-900/15 selection:text-teal-950 dark:selection:bg-teal-400/20 dark:selection:text-teal-100">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
