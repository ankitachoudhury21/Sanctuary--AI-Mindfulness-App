
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sanctuary | Your Peace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Outfit:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Calming Sanctuary Palette */
        --sanctuary-teal: #0d9488;
        --sanctuary-blue: #0369a1;
        --sanctuary-bg-tint: #f8fafc; 
        --sanctuary-text: #0f172a;
        --sanctuary-primary-light: #2dd4bf; /* A lighter tint of primary teal */
        --sanctuary-focus-ring: rgba(45, 212, 191, 0.4);
      }
      body {
        font-family: 'Quicksand', sans-serif;
        overflow-x: hidden;
        background-color: var(--sanctuary-bg-tint);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none;
        line-height: 1.6;
        color: var(--sanctuary-text);
      }
      body.dark {
        background-color: var(--sanctuary-bg-tint); /* Keep background white in dark mode */
        color: var(--sanctuary-text); /* Keep text dark in dark mode for readability */
      }
      h1, h2, h3, h4, .font-display, .display-number {
        font-family: 'Outfit', sans-serif;
        text-shadow: 0 1px 2px rgba(0,0,0,0.03);
        letter-spacing: -0.02em;
      }
      .label-caps {
        font-family: 'Outfit', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        font-weight: 800;
        font-size: 0.65rem;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.96); 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(13, 148, 136, 0.08);
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.04);
      }
      /* In dark mode, allow glass card to be transparent to underlying background */
      body.dark .glass-card {
        background: rgba(255, 255, 255, 0.15); /* More translucent for dark mode */
        border: 1px solid rgba(255, 255, 255, 0.1); /* Lighter border for contrast */
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.2); /* Deeper shadow for depth */
      }
      .calm-btn-primary {
        background: linear-gradient(135deg, #0d9488 0%, #0369a1 100%);
        color: white;
        font-family: 'Outfit', sans-serif;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .calm-btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(13, 148, 136, 0.25);
      }
      body.dark .calm-btn-primary:hover {
        box-shadow: 0 15px 30px rgba(45, 212, 191, 0.25);
      }
      .calm-btn-primary:active {
        transform: scale(0.97);
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--sanctuary-primary-light);
        border-radius: 10px;
        border: 2px solid transparent; /* Gives a subtle padding */
        background-clip: content-box; /* Ensures border doesn't get filled */
      }
      ::-webkit-scrollbar-track {
        background: rgba(var(--sanctuary-primary-light), 0.1);
        border-radius: 10px;
      }
      body.dark ::-webkit-scrollbar-thumb {
        background: var(--sanctuary-primary-light);
        border-color: #25282d; /* Darker border for dark mode */
      }
      body.dark ::-webkit-scrollbar-track {
        background: rgba(45, 212, 191, 0.05);
      }
      .hero-text-shadow {
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(var(--sanctuary-teal), 0.3);
        border-radius: 10px;
      }
      body.dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(45, 212, 191, 0.25);
      }
      .text-balance {
        text-wrap: balance;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      /* Global Focus Styles */
      :focus-visible {
        outline: 3px solid var(--sanctuary-focus-ring);
        outline-offset: 2px;
        border-radius: 8px; /* Default for most elements */
      }
      button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
        outline: 3px solid var(--sanctuary-focus-ring);
        outline-offset: 2px;
      }
      .rounded-full:focus-visible {
        border-radius: 9999px; /* Override for full rounded elements */
      }
      /* Custom strong text shadow for legibility */
      .text-shadow-strong {
        text-shadow: 
          0 0 8px rgba(0, 0, 0, 0.7), /* Stronger blur for glow effect */
          0 0 16px rgba(0, 0, 0, 0.5),
          1px 1px 3px rgba(0, 0, 0, 0.8); /* Solid shadow for definition */
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "recharts": "https://esm.sh/recharts@^3.6.0"
      }
    }
    </script>
  </head>
  <body class="selection:bg-teal-100 selection:text-teal-900">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script> 
  </body>
</html>
