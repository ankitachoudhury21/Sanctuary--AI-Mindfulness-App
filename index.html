
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sanctuary | Your Peace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Outfit:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Calming Sanctuary Palette */
        --sanctuary-teal: #0d9488;
        --sanctuary-blue: #0369a1;
        --sanctuary-bg-tint: #f8fafc; 
        --sanctuary-text: #0f172a;
      }
      body {
        font-family: 'Quicksand', sans-serif;
        overflow-x: hidden;
        background-color: var(--sanctuary-bg-tint);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none;
        line-height: 1.6;
        color: var(--sanctuary-text);
      }
      h1, h2, h3, h4, .font-display, .display-number {
        font-family: 'Outfit', sans-serif;
        text-shadow: 0 1px 2px rgba(0,0,0,0.03);
        letter-spacing: -0.02em;
      }
      .label-caps {
        font-family: 'Outfit', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        font-weight: 800;
        font-size: 0.65rem;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.96); 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(13, 148, 136, 0.08);
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.04);
      }
      .calm-btn-primary {
        background: linear-gradient(135deg, #0d9488 0%, #0369a1 100%);
        color: white;
        font-family: 'Outfit', sans-serif;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .calm-btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(13, 148, 136, 0.25);
      }
      .calm-btn-primary:active {
        transform: scale(0.97);
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #0d948833;
        border-radius: 10px;
      }
      .hero-text-shadow {
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(13, 148, 136, 0.15);
        border-radius: 10px;
      }
      .text-balance {
        text-wrap: balance;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
    </style>
    <script type="importmap">
    {
      import React from 'react'
import ReactDOM from 'react-dom/client'
import App from './App.jsx'
import './index.css'

// --- DEBUGGING START ---
console.log("System Check: Main file is running...");

try {
  const rootElement = document.getElementById('root');
  
  if (!rootElement) {
    throw new Error("FATAL: Cannot find <div id='root'> in index.html");
  }

  const root = ReactDOM.createRoot(rootElement);
  
  root.render(
    <React.StrictMode>
       <App />
    </React.StrictMode>
  );
  
  console.log("System Check: React render attempted.");
  
} catch (error) {
  // If anything crashes, print it on the screen!
  document.body.innerHTML = `
    <div style="color: red; padding: 20px; font-size: 20px; font-family: sans-serif;">
      <h1>Application Crashed</h1>
      <p><strong>Error:</strong> ${error.message}</p>
      <pre>${error.stack}</pre>
    </div>
  `;
  console.error("System Crash:", error);
}
// --- DEBUGGING END ---
