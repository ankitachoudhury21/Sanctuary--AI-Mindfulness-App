
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sanctuary | Your Peace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Outfit:wght@100;300;400;500;600;800&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Calming Sanctuary Palette */
        --sanctuary-teal: #0d9488;
        --sanctuary-blue: #0369a1;
        --sanctuary-bg-tint: #f8fafc; 
        --sanctuary-text: #0f172a;
      }
      body {
        font-family: 'Quicksand', sans-serif;
        overflow-x: hidden;
        background-color: var(--sanctuary-bg-tint);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Prevent bounce scroll on mobile for better app-like feel */
        overscroll-behavior-y: none;
      }
      h1, h2, h3, .font-display {
        font-family: 'Outfit', sans-serif;
        text-shadow: 0 1px 2px rgba(0,0,0,0.05);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.96); 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(13, 148, 136, 0.12);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
      }
      .calm-btn-primary {
        background: linear-gradient(135deg, #0d9488 0%, #0369a1 100%);
        color: white;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .calm-btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(13, 148, 136, 0.3);
      }
      .calm-btn-primary:active {
        transform: scale(0.96);
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #0d948844;
        border-radius: 10px;
      }
      .hero-text-shadow {
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(13, 148, 136, 0.2);
        border-radius: 10px;
      }
      /* Ensure text doesn't overflow on small devices */
      .text-balance {
        text-wrap: balance;
      }
      /* Prevent UI scaling issues on orientation change */
      html {
        -webkit-text-size-adjust: 100%;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "recharts": "https://esm.sh/recharts@^3.6.0"
      }
    }
    </script>
  </head>
  <body class="text-slate-900 transition-colors duration-1000 min-h-screen selection:bg-teal-100 selection:text-teal-900">
    <div id="root"></div>
  </body>
</html>
